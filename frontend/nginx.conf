# Serves the built SvelteKit app and proxies /api to the Go service.
# The browser only ever talks to this one origin, so no CORS is needed.
# The same file works on a Linux VM with nginx: change "api:8080" to the address
# of the Go service (for example 127.0.0.1:8080) and add TLS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index 200.html;

    # Request bodies are tiny (an answer is at most 1000 characters).
    client_max_body_size 20k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An evaluation can take a while when the AI provider is slow.
        proxy_read_timeout 90s;
    }

    # Built assets have content hashes in their names and never change.
    location /_app/immutable/ {
        expires 1y;
    }

    # Single-page app: any other URL is handled in the browser by the router.
    location / {
        try_files $uri $uri/ /200.html;
    }

    # Never cache the app shell, so a new build is picked up immediately.
    location = /200.html {
        expires -1;
    }
}
